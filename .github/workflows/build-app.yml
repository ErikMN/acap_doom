---
name: Build ACAP DOOM

permissions:
  contents: write

on:
  # 1) Automatic trigger on tag push
  push:
    tags:
      - "*"
  # 2) Manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to build"
        required: true

jobs:
  set-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}

    steps:
      # Determine which tag to build:
      # - If triggered by push (tags), use github.ref_name
      # - If triggered manually (workflow_dispatch), use inputs.tag_name
      - name: Set TAG variable
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ inputs.tag_name }}" >> "$GITHUB_ENV"
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            # 'refs/tags/x.y.z' -> 'x.y.z'
            SHORT_REF="${GITHUB_REF#refs/tags/}"
            echo "TAG=$SHORT_REF" >> "$GITHUB_ENV"
            echo "tag=$SHORT_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ ! "${{ env.TAG }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be in the format x.y.z"
            exit 1
          fi

  build:
    name: Build ACAP DOOM ${{ matrix.arch }} Binary
    runs-on: ubuntu-latest
    needs: set-tag

    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - armv7hf

    steps:
      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.arch }}-

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.set-tag.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image (${{ matrix.arch }})
        run: |
          docker buildx build \
            --build-arg ARCH=${{ matrix.arch }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            --load \
            --progress=plain \
            -t acap_doom_${{ matrix.arch }} \
            ./docker

      - name: Move new Docker cache
        if: always()
        run: |
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

      # The Docker image contains the verified shareware WAD used by packaging.
      - name: Copy WAD from Docker Image (${{ matrix.arch }})
        run: |
          bash ./scripts/dockercopy.sh \
            -i acap_doom_${{ matrix.arch }} \
            -f /opt/app/doom1.wad

      - name: Build .eap inside Docker (${{ matrix.arch }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            acap_doom_${{ matrix.arch }} \
            bash -c './docker/build_snd.sh y && ./docker/build_eap.sh 1 acap_doom "ACAP DOOM" ${{ matrix.arch }} y'

      - name: Find EAP file (${{ matrix.arch }})
        id: find_eap
        run: |
          EAP_FILE=$(ls -1 *${{ matrix.arch }}.eap 2>/dev/null | head -n1)
          if [ -z "$EAP_FILE" ]; then
            echo "No ${{ matrix.arch }} .eap file found!"
            exit 1
          fi
          echo "Found EAP file for ${{ matrix.arch }}: $EAP_FILE"
          echo "eap_file=$EAP_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload EAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: acap_doom_${{ matrix.arch }}
          path: ${{ steps.find_eap.outputs.eap_file }}

  publish:
    name: Publish ACAP DOOM Binaries
    runs-on: ubuntu-latest
    needs: [set-tag, build]

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Verify downloaded artifacts
        run: |
          find ./artifacts -type f -name '*.eap' -print
          EAP_COUNT=$(find ./artifacts -type f -name '*.eap' | wc -l)
          if [ "$EAP_COUNT" -ne 2 ]; then
            echo "Expected 2 .eap files, found $EAP_COUNT"
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.set-tag.outputs.tag }}
        run: |
          mapfile -t EAP_FILES < <(find ./artifacts -type f -name '*.eap' -print | sort)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${EAP_FILES[@]}" --clobber
          else
            gh release create "$TAG" "${EAP_FILES[@]}" \
              --verify-tag \
              --title "Build for $TAG" \
              --notes "ACAP DOOM binaries for $TAG."
          fi
